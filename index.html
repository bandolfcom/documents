<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/bandolf/logo-blue-square.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BANDOLF Geliştirici Dokümantasyonu — Ödeme orkestrasyon altyapısı." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>BANDOLF Dokümantasyon</title>
  </head>
  <body>
    <script>
      (function () {
        var stored = localStorage.getItem('bandolf-theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var theme = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light'
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
